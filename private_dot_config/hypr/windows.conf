windowrule {
  name = windowrule-1
  suppress_event = maximize
  opacity = 0.97 0.9
  match:class = .*
}

# Fix some dragging issues with XWayland
windowrule {
  name = windowrule-2
  no_focus = on
  match:class = ^$
  match:title = ^$
  match:xwayland = 1
  match:float = 1
  match:fullscreen = 0
  match:pin = 0
}

# App-specific tweaks
source = ~/.config/hypr/apps.conf
