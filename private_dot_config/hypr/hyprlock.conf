source = ~/.config/themes/current/hyprlock.conf

$font=JetBrainsMono Nerd Font Propo

background {
    monitor =
    color = $color
    path = ~/.config/themes/current/background.png
    blur_passes = 3
}

# Time
label {
  monitor =
  text = $TIME
  color = $font_color
  font_size = 90
  font_family = $font
  position = 0, -150
  halign = center
  valign = top
}

# Date
label {
  monitor =
  text = cmd[update:43200000] date +"%a %b %d"
  color = $font_color
  font_size = 25
  font_family = $font
  position = 0, -120
  halign = center
  valign = top
}

label {
  monitor =
  text = cmd[update:43200000] battery-info --percentage
  color = $font_color
  font_size = 11
  font_family = $font
  position = -18, -10
  halign = right
  valign = top
}

# USER AVATAR
image {
  monitor =
  path = $HOME/.face
  size = 100
  border_color = $outer_color
  border_size = 0
  position = 0, 180
  halign = center
  valign = bottom
}

# User's full name
label {
  monitor =
  text = cmd[update:0] getent passwd "$USER" | cut -d: -f5 | cut -d, -f1
  color = $font_color
  font_size = 14
  font_family = $font ExtraBold
  position = 0, 138
  halign = center
  valign = bottom
}

input-field {
    monitor =
    size = 230, 40
    position = 0, 82
    halign = center
    valign = bottom

    inner_color = $inner_color
    outer_color = $outer_color
    outline_thickness = 0

    font_family = $font
    font_color = $font_color

    placeholder_text =   Enter Password 
    check_color = $check_color
    fail_text = <i>$PAMFAIL ($ATTEMPTS)</i>

    rounding = -1
    shadow_passes = 0
    fade_on_empty = false
}


bezier = almostLinear, 0.5,  0.5,  0.75, 1.0
animation = fadeOut, 1, 1.46, almostLinear
